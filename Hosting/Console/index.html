<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive BDC</title>
<link rel="stylesheet" href="/console/app.css">
<script type="module" src="/console/app.js"></script>
</head>
<body>
<a class="skip" href="#view">Skip to the content</a>
<div class="layout">
  <nav class="nav" aria-label="Hive BDC">
    <div class="brand">
      <img class="brand-logo" src="/console/logo.svg" alt="Balsoft" width="112" height="32">
      <span class="brand-product">HIVE BDC</span>
    </div>
    <div id="instance-card" class="instance-card"></div>
    <div id="nav-links" class="nav-links"></div>
    <div class="nav-foot">
      <div id="service-box" class="service-box"></div>
      <div class="profile">
        <span id="user-initials" class="avatar" aria-hidden="true"></span>
        <span class="profile-text"><strong id="user-name"></strong><span id="user-role"></span></span>
        <a id="sign-out" class="sign-out" href="/.auth/logout" aria-label="Sign out" title="Sign out"></a>
      </div>
    </div>
  </nav>
  <div class="content">
    <header class="topbar">
      <div id="crumbs" class="topbar-crumbs"></div>
      <span id="instance" class="topbar-right"></span>
    </header>
    <main id="view" class="view" tabindex="-1" aria-live="polite">
      <p class="muted">Loading</p>
    </main>
  </div>
</div>
</body>
</html>
